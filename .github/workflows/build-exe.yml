name: build-windows-installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-exe:
    runs-on: windows-latest
    env:
      # Les consoles Windows des runners sont en cp1252 : sans cet encodage,
      # les messages de build (emojis inclus) lèvent UnicodeEncodeError.
      PYTHONIOENCODING: utf-8
    permissions:
      # Nécessaire pour attacher les binaires à la GitHub Release sur tag.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller

      - name: Compiler TheAgency.exe autonome
        run: python scripts/build_exe.py

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress

      - name: Compiler l'Assistant d'Installation Windows (TheAgency-Setup.exe)
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $isccPath)) {
            $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
            if ($isccCmd) { $isccPath = $isccCmd.Source }
          }
          & "$isccPath" installer.iss

      - name: Téléverser les exécutables Windows
        uses: actions/upload-artifact@v4
        with:
          name: TheAgency-Windows-Package
          path: |
            dist/TheAgency.exe
            dist/TheAgency-Setup.exe

      - name: Attacher les binaires à la GitHub Release (sur tag)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$env:GITHUB_REF_NAME" "dist/TheAgency.exe" "dist/TheAgency-Setup.exe" --clobber
